version: 0.2

phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
  build:
    commands:
      - docker build --platform linux/amd64 -t "$IMAGE_REPOSITORY:$IMAGE_TAG" .
      - docker tag "$IMAGE_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$IMAGE_REPOSITORY:$IMAGE_TAG"
  post_build:
    commands:
      - docker push "$ECR_REGISTRY/$IMAGE_REPOSITORY:$IMAGE_TAG"
      - printf '{"imageUri":"%s"}' "$ECR_REGISTRY/$IMAGE_REPOSITORY:$IMAGE_TAG" > image-detail.json

artifacts:
  files:
    - image-detail.json
