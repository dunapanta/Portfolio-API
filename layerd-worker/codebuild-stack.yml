AWSTemplateFormatVersion: "2010-09-09"
Description: Remote Docker builder and ECR repository for the self-hosted LayerD worker

Parameters:
  SourceBucket:
    Type: String
  SourceKey:
    Type: String
  RepositoryName:
    Type: String
    Default: duportfolioapi-layerd-worker

Resources:
  WorkerRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref RepositoryName
      ImageScanningConfiguration:
        ScanOnPush: true
      EmptyOnDelete: false

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: layerd-image-build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub arn:aws:s3:::${SourceBucket}/${SourceKey}
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt WorkerRepository.Arn

  WorkerBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: duportfolioapi-layerd-worker
      ServiceRole: !GetAtt BuildRole.Arn
      Source:
        Type: S3
        Location: !Sub ${SourceBucket}/${SourceKey}
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: ECR_REGISTRY
            Value: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
          - Name: IMAGE_REPOSITORY
            Value: !Ref RepositoryName
          - Name: IMAGE_TAG
            Value: latest

Outputs:
  RepositoryUri:
    Value: !GetAtt WorkerRepository.RepositoryUri
  BuildProjectName:
    Value: !Ref WorkerBuild
